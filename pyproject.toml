[project]
name = "primitive-db"
version = "0.1.0"
description = "Primitive JSON database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "prettytable>=3.12.0",
  "prompt>=0.4.1",
]

[[project.authors]]
name = "Ivan Sidorov"

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []